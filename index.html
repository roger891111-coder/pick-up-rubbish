<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDGs 性別平權</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft JhengHei", sans-serif; }
        body { background-color: #e0f2f1; overflow: hidden; position: relative; }
        #header { position: absolute; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 15px 25px; z-index: 10; pointer-events: none; }
        #title { font-size: 24px; font-weight: bold; color: #004d40; background: rgba(255,255,255,0.85); padding: 5px 15px; border-radius: 20px; pointer-events: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #score-board { font-size: 20px; font-weight: bold; color: #004d40; background: rgba(255,255,255,0.85); padding: 5px 15px; border-radius: 20px; pointer-events: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #map { width: 100vw; height: 100vh; background-color: #81c784; position: relative; border: 8px solid #5d4037; overflow: hidden; }
        .path { position: absolute; background-color: #d7ccc8; border-radius: 10px; z-index: 1; }
        
        /* 茅草屋樣式 */
        .hut { position: absolute; width: 70px; height: 70px; cursor: pointer; z-index: 3; transition: transform 0.2s; }
        .hut:hover { transform: scale(1.1); }
        .hut-roof { width: 0; height: 0; border-left: 35px solid transparent; border-right: 35px solid transparent; border-bottom: 30px solid #afb42b; }
        .hut-body { width: 60px; height: 40px; background-color: #ffe082; margin-left: 5px; border: 2px solid #795548; position: relative; border-top: none; }
        .hut-door { width: 16px; height: 25px; background-color: #795548; position: absolute; bottom: 0; left: 22px; }
        .hut.completed { filter: grayscale(1) opacity(0.6); cursor: not-allowed; }
        
        /* 新增樹木樣式 */
        .tree { position: absolute; width: 40px; height: 60px; z-index: 2; pointer-events: none; }
        .tree-leaves { width: 40px; height: 40px; background-color: #2e7d32; border-radius: 50%; box-shadow: inset -5px -5px 0 rgba(0,0,0,0.15); }
        .tree-trunk { width: 10px; height: 20px; background-color: #5d4037; margin: 0 auto; }

        /* 櫻花飄落特效 */
        .sakura { position: fixed; background: #ffb74d; background-color: #ffb7ce; border-radius: 50% 0 50% 50%; position: absolute; pointer-events: none; z-index: 5; animation: fall linear infinite; }
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) translateX(100px) rotate(360deg); opacity: 0; }
        }

        /* 泡泡特效 */
        .bubble { position: absolute; background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: inset 0 0 10px rgba(255,255,255,0.5); border-radius: 50%; pointer-events: none; z-index: 4; animation: floatUp linear infinite; }
        @keyframes floatUp {
            0% { transform: translateY(105vh) translateX(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) translateX(-50px); opacity: 0; }
        }

        /* 彈出視窗與結算畫面 */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; max-width: 500px; width: 90%; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        #question-text { font-size: 20px; margin-bottom: 20px; color: #333; font-weight: bold; }
        .option-btn { display: block; width: 100%; padding: 12px; margin: 10px 0; background: #e0f2f1; border: 2px solid #4db6ac; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.2s; text-align: left; }
        .option-btn:hover { background: #b2dfdb; }
        #result-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; color: white; flex-direction: column; }
        #result-title { font-size: 32px; margin-bottom: 15px; font-weight: bold; }
        #result-msg { font-size: 20px; margin-bottom: 30px; color: #e0e0e0; }
        .action-btn { padding: 15px 40px; font-size: 20px; font-weight: bold; border: none; border-radius: 30px; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.2s; }
        .retry-btn { background: #e53935; color: white; }
        .retry-btn:hover { background: #c62828; }
        .next-btn { background: #43a047; color: white; }
        .next-btn:hover { background: #2e7d32; }
    </style>
</head>
<body>
    <div id="header">
        <div id="title">SDGs 性別平權</div>
        <div id="score-board">答對題數：<span id="score">0</span> / 10</div>
    </div>
    <div id="map">
        <!-- 裝飾路徑 -->
        <div class="path" style="top: 20%; left: 10%; width: 80%; height: 20px;"></div>
        <div class="path" style="top: 20%; left: 50%; width: 20px; height: 60%;"></div>
        <div class="path" style="top: 75%; left: 15%; width: 70%; height: 20px;"></div>
    </div>
    <div id="modal">
        <div class="modal-content">
            <div id="question-text">題目載入中...</div>
            <div id="options-container"></div>
        </div>
    </div>
    <div id="result-screen">
        <div id="result-title"></div>
        <div id="result-msg"></div>
        <div id="result-action"></div>
    </div>
    <script>
        const questions = [
            { q: "SDGs 目標 5 的主要核心是什麼？", a: ["環境保護", "消除貧窮", "性別平權", "優質教育"], c: 2 },
            { q: "下列何者有助於消除職場上的性別薪資差距？", a: ["同工同酬原則", "依性別分配工作", "限制女性加班", "減少男性福利"], c: 0 },
            { q: "「家務事應該由全家人共同分擔」這句話符合性別平權嗎？", a: ["符合", "不符合", "看心情", "只有女性該做"], c: 0 },
            { q: "育嬰假應該由誰申請才符合性別平等？", a: ["只能由媽媽申請", "父母雙方皆可申請", "只能由爸爸申請", "都不需要申請"], c: 1 },
            { q: "培力女性與女童，對推動永續發展有何影響？", a: ["沒有任何好處", "只會增加經濟負擔", "能加速實現所有永續目標", "會導致男性失業"], c: 2 },
            { q: "在挑選職業時，我們應該依據什麼來做選擇？", a: ["傳統性別刻板印象", "個人的興趣與能力", "社會大眾的指指點點", "長輩指定的性別工作"], c: 1 },
            { q: "性別平權中的「性別」僅指男性和女性嗎？", a: ["是的，只有男女", "不是，包含多元性別及認同", "不知道", "不重要"], c: 1 },
            { q: "消除對婦女一切形式歧視的國際公約簡稱為？", a: ["UNESCO", "UNICEF", "CEDAW", "WHO"], c: 2 },
            { q: "看到同學因為性別氣質與他人不同而被嘲笑，應該怎麼做？", a: ["加入一起嘲笑", "當作沒看到", "制止霸凌並給予關懷", "幫忙錄影上傳"], c: 2 },
            { q: "推動性別平權是誰的責任？", a: ["只有政府的責任", "只有女性的責任", "全體社會公民的責任", "只有學校的責任"], c: 2 }
        ];
        const hutPositions = [
            { t: "12%", l: "12%" }, { t: "10%", l: "35%" }, { t: "12%", l: "60%" }, { t: "10%", l: "82%" },
            { t: "42%", l: "38%" }, { t: "45%", l: "58%" },
            { t: "68%", l: "15%" }, { t: "70%", l: "38%" }, { t: "68%", l: "65%" }, { t: "70%", l: "85%" }
        ];
        // 樹木放置座標位置
        const treePositions = [
            { t: "5%", l: "5%" }, { t: "5%", l: "25%" }, { t: "5%", l: "50%" }, { t: "5%", l: "73%" },
            { t: "35%", l: "20%" }, { t: "45%", l: "80%" }, { t: "55%", l: "10%" },
            { t: "85%", l: "30%" }, { t: "85%", l: "55%" }, { t: "85%", l: "75%" }
        ];

        let correctAnswers = 0;
        let answeredCount = 0;
        let currentHutIndex = null;
        const map = document.getElementById('map');
        const scoreDisplay = document.getElementById('score');
        const modal = document.getElementById('modal');
        const qText = document.getElementById('question-text');
        const optContainer = document.getElementById('options-container');

        function initGame() {
            // 生成茅草屋
            hutPositions.forEach((pos, index) => {
                const hut = document.createElement('div');
                hut.className = 'hut';
                hut.style.top = pos.t;
                hut.style.left = pos.l;
                hut.id = `hut-${index}`;
                hut.innerHTML = `<div class="hut-roof"></div><div class="hut-body"><div class="hut-door"></div></div>`;
                hut.onclick = () => openQuestion(index);
                map.appendChild(hut);
            });
            // 生成裝飾樹木
            treePositions.forEach(pos => {
                const tree = document.createElement('div');
                tree.className = 'tree';
                tree.style.top = pos.t;
                tree.style.left = pos.l;
                tree.innerHTML = `<div class="tree-leaves"></div><div class="tree-trunk"></div>`;
                map.appendChild(tree);
            });
            // 啟動環境特效
            createSakura();
            createBubbles();
        }

        // 動態生成櫻花
        function createSakura() {
            for (let i = 0; i < 30; i++) {
                const sakura = document.createElement('div');
                sakura.className = 'sakura';
                resetSakura(sakura);
                map.appendChild(sakura);
            }
        }
        function resetSakura(el) {
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = -Math.random() * 20 + 'px';
            const size = Math.random() * 8 + 8;
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.animationDuration = Math.random() * 4 + 4 + 's';
            el.style.animationDelay = Math.random() * 5 + 's';
        }

        // 動態生成泡泡
        function createBubbles() {
            for (let i = 0; i < 25; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                resetBubble(bubble);
                map.appendChild(bubble);
            }
        }
        function resetBubble(el) {
            el.style.left = Math.random() * 100 + 'vw';
            const size = Math.random() * 15 + 10;
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.animationDuration = Math.random() * 5 + 5 + 's';
            el.style.animationDelay = Math.random() * 6 + 's';
        }

        function openQuestion(index) {
            const hut = document.getElementById(`hut-${index}`);
            if (hut.classList.contains('completed')) return;
            currentHutIndex = index;
            const qData = questions[index];
            qText.innerText = `第 ${index + 1} 題：${qData.q}`;
            optContainer.innerHTML = '';
            qData.a.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx);
                optContainer.appendChild(btn);
            });
            modal.style.display = 'flex';
        }

        function checkAnswer(selectedIdx) {
            modal.style.display = 'none';
            const qData = questions[currentHutIndex];
            if (selectedIdx === qData.c) {
                correctAnswers++;
                scoreDisplay.innerText = correctAnswers;
                alert("答對了！太棒了！");
            } else {
                alert(`答錯了！正確答案是：${qData.a[qData.c]}`);
            }
            document.getElementById(`hut-${currentHutIndex}`).classList.add('completed');
            answeredCount++;
            if (answeredCount === 10) {
                showResult();
            }
        }

        function showResult() {
            const resScreen = document.getElementById('result-screen');
            const resTitle = document.getElementById('result-title');
            const resMsg = document.getElementById('result-msg');
            const resAction = document.getElementById('result-action');
            resScreen.style.display = 'flex';
            if (correctAnswers < 8) {
                resTitle.innerText = "挑戰失敗！";
                resMsg.innerText = `您只答對了 ${correctAnswers} 題，再加把勁，需要答對 8 題以上才能過關喔！`;
                resAction.innerHTML = `<button class="action-btn retry-btn" onclick="location.reload()">重新挑戰</button>`;
            } else {
                resTitle.innerText = "恭喜過關！";
                resMsg.innerText = `太厲害了！您答對了 ${correctAnswers} 題，成功解鎖下一關！`;
                resAction.innerHTML = `<a href="level2.html" class="action-btn next-btn">前往下一關</a>`;
            }
        }
        window.onload = initGame;
    </script>
</body>
</html>
